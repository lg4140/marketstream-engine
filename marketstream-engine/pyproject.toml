[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marketstream-engine"
version = "1.3.0"
description = "Validated, reproducible high-frequency market data processing and order-book analytics"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Lingkun Guo"}]
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "pyarrow>=14,<25",
    "pydantic>=2.6,<3",
    "PyYAML>=6,<7",
    "typer>=0.12,<1",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10", "pytest-cov>=5,<8", "hypothesis>=6",
    "ruff>=0.9", "mypy>=1.11", "build>=1",
]

[project.scripts]
marketstream = "marketstream.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

[tool.setuptools.package-data]
marketstream = ["resources/*.yaml"]
