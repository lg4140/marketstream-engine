# Default: synthetic demo, no confidential files; UTC offset/timezone intentionally unspecified.
output_dir: outputs/demo
input_dir: null
n_stocks: 3
n_snapshots: 1200
dates: ["20210104"]
seed: 42
snapshot_period_seconds: 3
trade_every_n_snapshots: 5
join_tolerance: 30s
resample_rule: 10min
on_invalid: fail
save_figure: true
figure_symbol: "1"
figure_date: null

tick_size: 0.01
tick_size_by_symbol: {}
trade_consistency: strict
amount_minor_units_per_unit: null

# Requested chart without source rows fails by default.
figure_missing: fail
quality_gates:
  min_trade_match_rate: null
  per_symbol_day_min_match_rate: null
  on_breach: fail
